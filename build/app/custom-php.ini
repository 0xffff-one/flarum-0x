; avoid the deprecated message to break flarum's code
display_errors = Off
; emit errors to local log file for easier tracing
log_errors = On
error_reporting = E_ALL
error_log = /dev/stdout
memory_limit = 256M
; CVE-2026-109618 / -109619 pre-patch mitigation: Flarum does not use the
; upload progress UI, and session.upload_progress is the verified trigger path
; for the ext/session rfc1867 UAF. Keep Off after the vendor patch lands.
session.upload_progress.enabled = Off
